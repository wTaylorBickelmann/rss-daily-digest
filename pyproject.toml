[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rss-daily-digest"
version = "0.1.0"
description = "Daily Gemini blog posts from RSS, published to GitHub Pages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "jinja2>=3.1",
    "markdown>=3.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
digest = "digest.cli:main"

[tool.setuptools.packages.find]
include = ["digest*"]

[tool.setuptools.package-data]
digest = ["templates/*.html", "static/*"]
