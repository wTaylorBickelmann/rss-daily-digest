# Daily RSS → Gemini digest, then publish the static site from /docs.

name: Daily digest

on:
  schedule:
    - cron: "0 12 * * *"  # 12:00 UTC
  workflow_dispatch:

# contents: write — commit posts/ and docs/
# pages: write + id-token — unused while Pages is "Deploy from branch /docs",
# but kept so this workflow can later switch to actions/deploy-pages.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Require GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Missing secret GEMINI_API_KEY."
            echo "Add it at Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      # Models come from feeds.yaml (gemini-3.6-flash text, gemini-3.1-flash-image headers).
      # gemini-2.0-flash is retired (404). Header JPEGs land in docs/assets/headers/.
      - name: Fetch, summarize, build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m digest run

      - name: Commit posts and site if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts docs
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily digest $(date -u +%F)"
            git push
          fi
